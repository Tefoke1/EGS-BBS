<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="423" viewBox="0 0 1040 423" role="img"><title>EGS-BBS roadmap</title><desc>Available in 0.8.0: First-person construction, Hull integrity and balance, Planetary flight estimates, Device groups and signal logic, Photo and video | Next in development: Cinematic rendering, Flight model calibration, AI ship construction, Large projects and capture, Signals and community reports</desc><rect width="1040" height="423" rx="14" fill="#11232e"/><g font-family="Segoe UI,Arial,sans-serif">
<rect x="18" y="15" width="494" height="392" rx="9" fill="#192d39" stroke="#385462"/><circle cx="43" cy="46" r="5" fill="#c5e87b"/><text x="58" y="54" font-size="24" font-weight="600" fill="#c5e87b">Available in 0.8.0</text>
<path d="M37 74h456" stroke="#385462"/><text x="38" y="99" font-size="18" font-weight="600" fill="#f1f5f8">First-person construction</text><text x="38" y="122" font-size="16" fill="#c1d0da">Place rows, rotate devices, mirror a build.</text>
<path d="M37 140h456" stroke="#385462"/><text x="38" y="165" font-size="18" font-weight="600" fill="#f1f5f8">Surface painting</text><text x="38" y="188" font-size="16" fill="#c1d0da">Inspect airtight blocks and the centre of mass.</text>
<path d="M37 206h456" stroke="#385462"/><text x="38" y="231" font-size="18" font-weight="600" fill="#f1f5f8">Planetary flight estimates</text><text x="38" y="254" font-size="16" fill="#c1d0da">Compare lift, acceleration and payload.</text>
<path d="M37 272h456" stroke="#385462"/><text x="38" y="297" font-size="18" font-weight="600" fill="#f1f5f8">Device groups and signal logic</text><text x="38" y="320" font-size="16" fill="#c1d0da">Trace receivers and test a two-sensor circuit.</text>
<path d="M37 338h456" stroke="#385462"/><text x="38" y="363" font-size="18" font-weight="600" fill="#f1f5f8">Photo and video</text><text x="38" y="386" font-size="16" fill="#c1d0da">Export 4K PNG and record layered MP4 shots.</text>
<rect x="528" y="15" width="494" height="392" rx="9" fill="#192d39" stroke="#385462"/><circle cx="553" cy="46" r="5" fill="#a6d2e4"/><text x="568" y="54" font-size="24" font-weight="600" fill="#a6d2e4">Next in development</text>
<path d="M547 74h456" stroke="#385462"/><text x="548" y="99" font-size="18" font-weight="600" fill="#f1f5f8">Hull integrity and balance</text><text x="548" y="122" font-size="16" fill="#c1d0da">Steadier camera motion on megaprojects.</text>
<path d="M547 140h456" stroke="#385462"/><text x="548" y="165" font-size="18" font-weight="600" fill="#f1f5f8">Flight model calibration</text><text x="548" y="188" font-size="16" fill="#c1d0da">Compare handling with loaded ships in game.</text>
<path d="M547 206h456" stroke="#385462"/><text x="548" y="231" font-size="18" font-weight="600" fill="#f1f5f8">AI ship construction</text><text x="548" y="254" font-size="16" fill="#c1d0da">Develop generation from a text description.</text>
<path d="M547 272h456" stroke="#385462"/><text x="548" y="297" font-size="18" font-weight="600" fill="#f1f5f8">Large projects and capture</text><text x="548" y="320" font-size="16" fill="#c1d0da">Improve loading, memory use and MP4 recording.</text>
<path d="M547 338h456" stroke="#385462"/><text x="548" y="363" font-size="18" font-weight="600" fill="#f1f5f8">Signals and community reports</text><text x="548" y="386" font-size="16" fill="#c1d0da">Verify more circuits in game and fix reported bugs.</text>
</g></svg>
