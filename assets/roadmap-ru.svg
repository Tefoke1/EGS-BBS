<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="423" viewBox="0 0 1040 423" role="img"><title>Карта разработки EGS-BBS</title><desc>Доступно в 0.7.0: Строительство от первого лица, Покраска поверхностей, Лётные характеристики, Группы устройств и сигналы, Фото и видео | Дальше в разработке: Герметичность и баланс, Уточнение лётной модели, ИИ-конструктор, Крупные проекты и съёмка, Сигналы и отзывы сообщества</desc><rect width="1040" height="423" rx="14" fill="#11232e"/><g font-family="Segoe UI,Arial,sans-serif">
<rect x="18" y="15" width="494" height="392" rx="9" fill="#192d39" stroke="#385462"/><circle cx="43" cy="46" r="5" fill="#c5e87b"/><text x="58" y="54" font-size="24" font-weight="600" fill="#c5e87b">Доступно в 0.7.0</text>
<path d="M37 74h456" stroke="#385462"/><text x="38" y="99" font-size="18" font-weight="600" fill="#f1f5f8">Строительство от первого лица</text><text x="38" y="122" font-size="16" fill="#c1d0da">Ряды блоков, поворот устройств, симметрия.</text>
<path d="M37 140h456" stroke="#385462"/><text x="38" y="165" font-size="18" font-weight="600" fill="#f1f5f8">Покраска поверхностей</text><text x="38" y="188" font-size="16" fill="#c1d0da">Образцы цвета, текстур и отдельных декалей.</text>
<path d="M37 206h456" stroke="#385462"/><text x="38" y="231" font-size="18" font-weight="600" fill="#f1f5f8">Лётные характеристики</text><text x="38" y="254" font-size="16" fill="#c1d0da">Оценка взлёта, ускорения и полезной нагрузки.</text>
<path d="M37 272h456" stroke="#385462"/><text x="38" y="297" font-size="18" font-weight="600" fill="#f1f5f8">Группы устройств и сигналы</text><text x="38" y="320" font-size="16" fill="#c1d0da">Карта связей и учебная схема с двумя датчиками.</text>
<path d="M37 338h456" stroke="#385462"/><text x="38" y="363" font-size="18" font-weight="600" fill="#f1f5f8">Фото и видео</text><text x="38" y="386" font-size="16" fill="#c1d0da">PNG до 4K и запись MP4 с проявлением слоёв.</text>
<rect x="528" y="15" width="494" height="392" rx="9" fill="#192d39" stroke="#385462"/><circle cx="553" cy="46" r="5" fill="#a6d2e4"/><text x="568" y="54" font-size="24" font-weight="600" fill="#a6d2e4">Дальше в разработке</text>
<path d="M547 74h456" stroke="#385462"/><text x="548" y="99" font-size="18" font-weight="600" fill="#f1f5f8">Герметичность и баланс</text><text x="548" y="122" font-size="16" fill="#c1d0da">Проверка герметичности и показ центра масс.</text>
<path d="M547 140h456" stroke="#385462"/><text x="548" y="165" font-size="18" font-weight="600" fill="#f1f5f8">Уточнение лётной модели</text><text x="548" y="188" font-size="16" fill="#c1d0da">Сверка управляемости под нагрузкой с игрой.</text>
<path d="M547 206h456" stroke="#385462"/><text x="548" y="231" font-size="18" font-weight="600" fill="#f1f5f8">ИИ-конструктор</text><text x="548" y="254" font-size="16" fill="#c1d0da">Построение корабля по текстовому описанию.</text>
<path d="M547 272h456" stroke="#385462"/><text x="548" y="297" font-size="18" font-weight="600" fill="#f1f5f8">Крупные проекты и съёмка</text><text x="548" y="320" font-size="16" fill="#c1d0da">Ускорение загрузки, экономия памяти, запись MP4.</text>
<path d="M547 338h456" stroke="#385462"/><text x="548" y="363" font-size="18" font-weight="600" fill="#f1f5f8">Сигналы и отзывы сообщества</text><text x="548" y="386" font-size="16" fill="#c1d0da">Проверка схем в игре и исправление ошибок.</text>
</g></svg>
