<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="594" viewBox="0 0 1040 594" role="img">
<title>Карта разработки EGS-BBS</title>
<desc>Расчёт характеристик: Тяга вперёд, назад и вверх; перегрузка G при полной загрузке.; Герметичность и баланс: Проверка герметичности корпуса и отображение центра масс.; Строительство: Удобнее размещать блоки, выбирать позиции и поворачивать детали.; ИИ-конструктор: Доработка построения кораблей по текстовому описанию.; Сигналы и логика: Полноценное создание и управление сигналами и логическими цепями.; Производительность: Снижение нагрузки на систему и оптимизация больших проектов.; Запись видео: Улучшение существующих инструментов съёмки и экспорта.; Обратная связь: Исправление багов и ошибок, выявляемых сообществом.</desc>
<rect width="1040" height="594" rx="16" fill="#11232e"/>
<g transform="translate(18 18)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#a6d2e4" stroke-width="3"/><g transform="translate(19 20)" stroke="#a6d2e4" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 23a12 12 0 1 1 24 0M16 20l7-9M7 23h18"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Расчёт характеристик</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Тяга вперёд, назад и вверх;</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">перегрузка G при полной загрузке.</text>
</g>
<g transform="translate(529 18)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#c5e87b" stroke-width="3"/><g transform="translate(19 20)" stroke="#c5e87b" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h20v22H6zM11 16h10M16 11v10"/><circle cx="16" cy="16" r="9"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Герметичность и баланс</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Проверка герметичности корпуса</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">и отображение центра масс.</text>
</g>
<g transform="translate(18 162)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#a6d2e4" stroke-width="3"/><g transform="translate(19 20)" stroke="#a6d2e4" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 12 7v14l-12 7L4 24V10zM4 10l12 7 12-7M16 17v14"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Строительство</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Удобнее размещать блоки,</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">выбирать позиции и поворачивать детали.</text>
</g>
<g transform="translate(529 162)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#c5e87b" stroke-width="3"/><g transform="translate(19 20)" stroke="#c5e87b" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="20" height="20" rx="5"/><path d="M16 2v5M2 16h4M26 16h4M12 21h8"/><circle cx="12" cy="14" r="1"/><circle cx="20" cy="14" r="1"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">ИИ-конструктор</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Доработка построения кораблей</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">по текстовому описанию.</text>
