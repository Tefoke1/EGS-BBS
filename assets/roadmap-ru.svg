<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Запись видео</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Улучшение существующих</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">инструментов съёмки и экспорта.</text>
</g>
<g transform="translate(529 450)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#c5e87b" stroke-width="3"/><g transform="translate(19 20)" stroke="#c5e87b" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h24v18H13l-7 6v-6H4zM9 11h14M9 17h10"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Обратная связь</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Исправление багов и ошибок,</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">выявляемых сообществом.</text>
</g>
