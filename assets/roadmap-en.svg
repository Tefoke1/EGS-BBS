<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Forward, reverse and upward thrust;</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">G-force with a fully loaded ship.</text>
</g>
