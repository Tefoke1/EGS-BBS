<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Сигналы и логика</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Полноценное создание и управление</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">сигналами и логическими цепями.</text>
</g>
<g transform="translate(529 306)"><rect width="493" height="126" rx="9" fill="#1c303d" stroke="#3a5362"/><path d="M1 25v76" stroke="#c5e87b" stroke-width="3"/><g transform="translate(19 20)" stroke="#c5e87b" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="16" height="16" rx="2"/><path d="M12 3v5M20 3v5M12 24v5M20 24v5M3 12h5M3 20h5M24 12h5M24 20h5"/></g>
<text x="67" y="37" fill="#f0f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Производительность</text>
<text x="22" y="76" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">Снижение нагрузки на систему</text>
<text x="22" y="101" fill="#bfd0db" font-family="Segoe UI,Arial,sans-serif" font-size="18">и оптимизация больших проектов.</text>
