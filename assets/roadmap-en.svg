<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="594" viewBox="0 0 1040 594" role="img">
<title>EGS-BBS development roadmap</title>
<desc>Performance calculator: Forward, reverse and upward thrust; G-force with a fully loaded ship.; Airtightness and balance: Hull airtightness checks and a centre-of-mass display.; Building tools: Better block placement, positioning and rotation controls.; AI ship builder: Improve ship generation from text descriptions.; Signals and logic: Verify device connections and circuit behavior in game.; System performance: Reduce system load and optimise large projects.; Video recording: Improve the existing filming and export tools.; Community feedback: Fix bugs and errors reported by the community.</desc>
